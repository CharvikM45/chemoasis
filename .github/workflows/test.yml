# Runs every test suite (account server, recommender, forum) on each pull request and on main,
# so a merge that breaks something shows a red X on the PR before it's merged.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
